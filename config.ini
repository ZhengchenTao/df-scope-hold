; -----------------------------------------------
; 鼠标按键映射工具配置文件
; 注意：修改后需重启脚本生效
; -----------------------------------------------

[config]
; 模拟的目标按键（支持普通字符或系统键）
; 格式要求：
;   - 普通字符键: 直接写字母（例如 a, b, 1, 2）
;   - 系统功能键: 使用 pynput 的 Key 属性名（例如 shift, ctrl, alt）
; 示例: shift (默认值) / ctrl / a
key = f12

; 按键触发延迟（单位：毫秒）
; 作用：按下鼠标右键后，等待多少毫秒再触发目标键
; 建议值：
;   - 游戏场景: 5-20ms
;   - 办公场景: 10-50ms
; 警告：设置低于5ms可能导致操作冲突
delay_press = 5

; 需要监控的应用程序进程名（区分大小写）
; 格式要求：
;   - 必须与任务管理器中的进程名完全一致（包括扩展名）
;   - 示例：notepad.exe / chrome.exe / photoshop.exe
; 功能说明：只有该程序运行时才会激活鼠标监听
program_running = DeltaForceClient-Win64-Shipping.exe

; 激光/手电按键（用于开镜时吃上激光开镜速度的加成）
; 行为：按下右键时先按一下此键（开激光），松开右键时再按一下此键（关激光）
; 格式要求：与 key 相同；普通字符直接写（例如 y），系统功能键用 pynput 的 Key 属性名
; 留空表示不启用此功能
laser_key = y

; 激光按键按下到松开的间隔（单位：毫秒）
; 作用：模拟"按一下"时，按下和松开之间的停留时间，太短可能不被游戏识别
; 建议值：5-30ms
laser_hold = 10